[project]
name = "riftbound-bot"
version = "0.1.0"
description = "Traditional Chinese Riftbound rules & card-interaction Discord bot (RAG)"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.4",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.2",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
riftbound-bot = "riftbound_bot.bot:main"
riftbound-build-index = "riftbound_bot.ingest.build_index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riftbound_bot"]
