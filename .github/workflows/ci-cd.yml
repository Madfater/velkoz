name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match docker-compose.yml: the test suite runs ingest/db.py's
        # CREATE EXTENSION vector, which stock postgres images don't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: riftbound
          POSTGRES_PASSWORD: riftbound
          POSTGRES_DB: riftbound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riftbound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://riftbound:riftbound@localhost:5432/riftbound
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Docker build sanity check
        run: docker build -t riftbound-bot:ci-check .

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR repository names must be lowercase, but github.repository_owner
      # preserves the account's original casing ("Madfater"), which buildx
      # rejects as an invalid tag. Lowercase it here.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/riftbound-bot" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploys to Arcane (a self-hosted Docker-management UI,
      # https://getarcane.app) via its REST API, authenticated with an API
      # key in the `X-Api-Key` header.
      #
      # This is TWO ordered calls, and both are load-bearing:
      #
      #   1. gitops-syncs/<id>/sync — copies docker-compose.yml from this repo
      #      into the Arcane project. The sync is configured autoSync=false,
      #      so without this call Arcane keeps deploying whatever compose it
      #      last saw, no matter how many times you redeploy.
      #   2. projects/<id>/up — pulls :latest (compose-side `pull_policy:
      #      always`) and recreates whatever changed.
      #
      # Skipping step 1 is what broke the deploy on 2026-08-14: the project
      # stayed pinned to the pre-#10 compose (postgres:16-alpine, ./data bind
      # mount) while :latest moved on to the postgres-only image. bootstrap
      # then died on `CREATE EXTENSION vector` (exit 1) against stock
      # postgres, and because bot gates on `service_completed_successfully`
      # it never started at all. The old ARCANE_WEBHOOK_URL webhook only ever
      # did step 2, so re-pointing it would not have been enough.
      #
      # Operational notes:
      # - Both endpoints stream newline-delimited JSON. A non-2xx is caught by
      #   `--fail-with-body`; an error reported *inside* a 200 stream is caught
      #   by grepping for `"success":false`. Without the grep a failed deploy
      #   looks green.
      # - The GHCR package must be public, or the Arcane host needs
      #   `docker login ghcr.io` with a PAT that has read:packages.
      # - There is no "deploy this specific version" concept — `up` always
      #   resolves whatever :latest points to. The sha-<...> tags above are
      #   audit/rollback artifacts only. Rollback = re-tag a known good
      #   sha-<...> as :latest in GHCR, then re-run this job.
      - name: Deploy to Arcane
        env:
          ARCANE_URL: ${{ secrets.ARCANE_URL }}
          ARCANE_API_KEY: ${{ secrets.ARCANE_API_KEY }}
          ENV_ID: "0"
          SYNC_ID: d5adc72f-efe9-45b5-9549-11922ab47a24
          PROJECT_ID: ef841605-4714-4f4d-82e8-226f9cede703
        run: |
          set -euo pipefail

          arcane() {
            curl -sS --fail-with-body -X POST \
              -H "X-Api-Key: ${ARCANE_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d '{}' "${ARCANE_URL}$1"
          }

          echo "::group::Sync compose from git"
          arcane "/api/environments/${ENV_ID}/gitops-syncs/${SYNC_ID}/sync" | tee sync.log
          echo "::endgroup::"
          if grep -q '"success":false' sync.log; then
            echo "::error::GitOps sync failed"; exit 1
          fi

          echo "::group::Bring the project up"
          arcane "/api/environments/${ENV_ID}/projects/${PROJECT_ID}/up" | tee up.log
          echo "::endgroup::"
          if grep -q '"success":false' up.log; then
            echo "::error::Project up failed"; exit 1
          fi

          echo "Deployed."
