name: CI/CD

on:
  # Only main on push: every other branch is covered by its pull request, and
  # matching both ran the whole job (two docker builds included) twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riftbound
          POSTGRES_PASSWORD: riftbound
          POSTGRES_DB: riftbound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riftbound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Scratch database for tests/test_db.py, which TRUNCATEs what it points
      # at. Deliberately not DATABASE_URL — see that module's docstring.
      TEST_DATABASE_URL: postgresql://riftbound:riftbound@localhost:5432/riftbound
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Matches .python-version and the Dockerfile; without it uv resolves
          # whatever satisfies requires-python, which need not be 3.12.
          python-version: "3.12"

      - name: Install dependencies
        # --locked so a pyproject/uv.lock drift fails here rather than being
        # silently resolved away and then failing the Docker build instead.
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Docker build sanity check
        run: docker build -t riftbound-bot:ci-check .

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/riftbound-bot:latest
            ghcr.io/${{ github.repository_owner }}/riftbound-bot:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Triggers a redeploy on the target server. This project uses Arcane
      # (a self-hosted Docker-management UI, https://getarcane.app) — its
      # inbound webhook is `POST /api/webhooks/trigger/{token}`, where the
      # token embedded in the URL *is* the credential (no extra header
      # needed), created via Arcane's Settings -> Webhooks UI. Bind it to
      # the bot project's "Update" action, not "Redeploy" — a known upstream
      # bug (getarcaneapp/arcane#1943) affects Redeploy's down+up sequence
      # on agent-managed hosts; verify against your own Arcane instance
      # before relying on Redeploy instead.
      #
      # Operational notes:
      # - Arcane's project pull policy must be "always" so Update actually
      #   pulls the freshly-pushed :latest tag instead of a cached layer.
      # - The GHCR package must be public, or the Arcane host needs
      #   `docker login ghcr.io` with a PAT that has read:packages.
      # - Arcane's webhook has no "redeploy this specific version" concept —
      #   it always resolves whatever :latest points to. The sha-<...> tags
      #   above are audit/rollback artifacts only. Rollback = re-tag a known
      #   good sha-<...> as :latest in GHCR, then re-trigger this webhook.
      # The URL is itself the credential, so it goes through the environment
      # rather than being interpolated into the command line, where it would
      # be visible in the runner's process table and in curl's own errors.
      - name: Trigger Arcane redeploy
        env:
          ARCANE_WEBHOOK_URL: ${{ secrets.ARCANE_WEBHOOK_URL }}
        run: curl -fsS -X POST "$ARCANE_WEBHOOK_URL"
