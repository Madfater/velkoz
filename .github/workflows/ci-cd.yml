name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match docker-compose.yml: the test suite runs ingest/db.py's
        # CREATE EXTENSION vector, which stock postgres images don't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: riftbound
          POSTGRES_PASSWORD: riftbound
          POSTGRES_DB: riftbound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riftbound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://riftbound:riftbound@localhost:5432/riftbound
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Docker build sanity check
        run: docker build -t riftbound-bot:ci-check .

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR repository names must be lowercase, but github.repository_owner
      # preserves the account's original casing ("Madfater"), which buildx
      # rejects as an invalid tag. Lowercase it here.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/riftbound-bot" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Triggers a redeploy on the target server. This project uses Arcane
      # (a self-hosted Docker-management UI, https://getarcane.app) — its
      # inbound webhook is `POST /api/webhooks/trigger/{token}`, where the
      # token embedded in the URL *is* the credential (no extra header
      # needed), created via Arcane's Settings -> Webhooks UI. Bind it to
      # the bot project's "Update" action, not "Redeploy" — a known upstream
      # bug (getarcaneapp/arcane#1943) affects Redeploy's down+up sequence
      # on agent-managed hosts; verify against your own Arcane instance
      # before relying on Redeploy instead.
      #
      # Operational notes:
      # - Getting the freshly-pushed :latest instead of a cached layer is
      #   enforced compose-side by `pull_policy: always` (docker-compose.yml);
      #   setting Arcane's own project pull policy to "always" too is belt and
      #   braces. Without either, Update re-runs the stale local image and the
      #   deploy silently no-ops.
      # - The GHCR package must be public, or the Arcane host needs
      #   `docker login ghcr.io` with a PAT that has read:packages.
      # - Arcane's webhook has no "redeploy this specific version" concept —
      #   it always resolves whatever :latest points to. The sha-<...> tags
      #   above are audit/rollback artifacts only. Rollback = re-tag a known
      #   good sha-<...> as :latest in GHCR, then re-trigger this webhook.
      - name: Trigger Arcane redeploy
        run: curl -fsS -X POST "${{ secrets.ARCANE_WEBHOOK_URL }}"
